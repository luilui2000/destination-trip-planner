<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>目的地行程</title>
  <style>
    :root{--ink:#282522;--muted:#817b75;--paper:#f7f4f1;--surface:#fff;--line:#e8e1da;--orange:#f06a32;--orange-soft:#fff0e8;--green:#338765;--green-soft:#eaf6f0;--blue:#3484ad;--blue-soft:#eaf5fb;--hour:66px;--time:58px;--day:280px}
    *{box-sizing:border-box}html,body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}button{font:inherit;color:inherit}
    .topbar{min-height:90px;display:flex;align-items:center;gap:28px;padding:16px 22px;background:rgba(255,255,255,.92);border-bottom:1px solid var(--line)}
    .brand{min-width:260px}.brand h1{margin:0 0 5px;font-size:23px}.brand p{margin:0;color:var(--muted)}.route{display:flex;align-items:center;gap:8px;white-space:nowrap}.route b{padding:8px 12px;border-radius:999px;background:#fff;box-shadow:0 4px 18px #5e463a12}.route i{color:#aaa;font-style:normal}
    .legend{margin-left:auto;display:flex;align-items:center;gap:18px;color:var(--muted);white-space:nowrap}.legend span{display:flex;align-items:center;gap:7px}.dot{width:9px;height:9px;border-radius:50%}.dot.blue{background:var(--blue)}.dot.green{background:var(--green)}.dot.orange{background:var(--orange)}
    .layout{display:flex;gap:16px;padding:16px;height:calc(100vh - 90px)}.map-panel{width:36vw;min-width:390px;overflow:hidden;background:#fff;border-radius:24px;box-shadow:0 10px 40px #5b463a12}.map-head{height:82px;display:flex;align-items:center;gap:12px;padding:16px 19px;border-bottom:1px solid var(--line)}.map-head .pin{font-size:25px;color:var(--orange)}.map-head h2{margin:0;font-size:18px}.map-head p{margin:4px 0 0;color:var(--muted)}.map-actions{margin-left:auto;display:flex;gap:8px}.map-actions a,.map-actions button{border:0;border-radius:12px;background:var(--paper);padding:10px 12px;text-decoration:none;cursor:pointer}.map-frame{width:100%;height:calc(100% - 82px);border:0}
    .calendar-shell{flex:1;min-width:0;overflow:auto;background:#fff;border-radius:24px;box-shadow:0 10px 40px #5b463a12}.calendar{position:relative;display:grid;grid-template-columns:var(--time) repeat(var(--days),var(--day));grid-template-rows:72px calc((var(--end) - var(--start))*var(--hour));min-width:max-content}.corner{position:sticky;left:0;top:0;z-index:5;display:grid;place-items:center;background:var(--ink);color:#fff;font-size:11px;font-weight:800;letter-spacing:.12em;border-radius:0 0 22px 0}.day-head{position:sticky;top:0;z-index:4;display:flex;align-items:center;gap:10px;padding:10px;background:#fffcfa;border-left:1px solid var(--line);border-bottom:1px solid var(--line);cursor:pointer}.day-head:hover,.day-head.active{background:var(--orange-soft)}.date{width:45px;height:48px;display:grid;place-items:center;align-content:center;border-radius:13px;background:var(--ink);color:#fff}.date small{font-size:8px;opacity:.65}.date strong{font-size:20px}.day-head h3{margin:0;font-size:13px}.day-head p{margin:4px 0 0;color:var(--orange);font-size:10px;font-weight:700}.route-icon{margin-left:auto;color:var(--muted)}
    .time-axis{position:sticky;left:0;z-index:3;background:#fff;border-right:1px solid var(--line)}.time-label{position:absolute;right:10px;transform:translateY(-50%);color:#999}.day-body{position:relative;border-left:1px solid var(--line);background:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--hour) - 1px),var(--line) calc(var(--hour) - 1px),var(--line) var(--hour))}.event{position:absolute;left:9px;right:9px;overflow:hidden;padding:10px 34px 10px 13px;border-radius:14px;background:var(--orange-soft);box-shadow:0 5px 14px #5133220d}.event:before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:4px;background:var(--orange)}.event.break{background:var(--green-soft)}.event.break:before{background:var(--green)}.event.transfer,.event.fixed{background:var(--blue-soft)}.event.transfer:before,.event.fixed:before{background:var(--blue)}.event time{display:block;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.04em}.event strong{display:block;margin-top:3px;font-size:14px}.event small{display:block;margin-top:5px;color:var(--muted)}.event .map-btn{position:absolute;right:8px;top:8px;width:26px;height:26px;border:0;border-radius:50%;background:#ffffffc9;cursor:pointer}.event.compact small{display:none}
    @media(max-width:820px){.topbar{min-height:auto;flex-wrap:wrap;padding:12px 14px;gap:12px}.brand{min-width:0}.brand h1{font-size:18px}.route{order:3;width:100%;overflow:auto}.legend{gap:10px;font-size:12px}.layout{height:auto;min-height:calc(100vh - 120px);flex-direction:column;padding:10px}.map-panel{width:100%;min-width:0;height:280px}.calendar-shell{height:70vh}.calendar{--day:220px}.map-head{height:66px;padding:10px 14px}.map-frame{height:calc(100% - 66px)}}
    @media print{.layout{height:auto}.map-panel{display:none}.calendar-shell{overflow:visible}.calendar{--day:220px}.map-btn{display:none}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><h1>目的地 · 5天4晚</h1><p>当地时间 · 在这里写时差和日期</p></div>
    <div class="route"><b>出发地</b><i>→</i><b>目的地 · 4晚</b></div>
    <div class="legend"><span><i class="dot blue"></i>交通接驳</span><span><i class="dot green"></i>餐饮／酒店休息</span><span><i class="dot orange"></i>游玩活动</span></div>
  </header>
  <main class="layout">
    <aside class="map-panel">
      <div class="map-head"><span class="pin">⌖</span><div><h2 id="mapTitle">目的地</h2><p id="mapSubtitle">点击日程或日期查看地图</p></div><div class="map-actions"><button id="zoomButton">适中</button><a id="mapOpen" href="https://maps.google.com" target="_blank" rel="noreferrer">大图</a></div></div>
      <iframe class="map-frame" id="mapFrame" title="行程地点地图" src="https://maps.google.com/maps?output=embed&amp;q=Tokyo&amp;z=12" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
    </aside>
    <section class="calendar-shell"><div class="calendar" id="calendar"><div class="corner">LOCAL<br>TIME</div></div></section>
  </main>
  <script>
    // Replace the sample data. Event tuple: [start,end,type,title,note,mapQuery,tag,mapPoints]
    const days=[
      {m:'OCT',d:'01',w:'周四',city:'目的地',title:'抵达与入住',hotel:'Example Hotel Downtown',e:[
        ['09:00','09:50','break','酒店早餐','慢启动，确认随身物品','Example Hotel Downtown',''],
        ['10:10','11:40','normal','城市地标','替换为准确地点与游览内容','Example City Landmark',''],
        ['11:40','11:58','transfer','打车18分钟 6.2km','','',''],
        ['11:58','13:20','normal','博物馆','提前核验开馆日与预约要求','Example City Museum',''],
        ['13:30','14:30','break','当地午餐','','Example Local Restaurant','']
      ]},
      {m:'OCT',d:'02',w:'周五',city:'目的地',title:'街区步行',hotel:'Example Hotel Downtown',e:[
        ['08:30','09:15','break','酒店早餐','','Example Hotel Downtown',''],
        ['09:30','11:00','normal','历史街区','相邻景点步行距离小于 1.5km，不出接驳卡','Example Historic District','步行'],
        ['11:15','12:15','normal','市场与小店','组合项目可配置多个地图点','Example Market','', ['Example Market','Example Craft Street']],
        ['12:20','13:20','break','午餐','','Example Market Restaurant','']
      ]}
    ];
    const startHour=7,endHour=22,hourHeight=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--hour'));
    const calendar=document.getElementById('calendar'),mapFrame=document.getElementById('mapFrame'),mapTitle=document.getElementById('mapTitle'),mapSubtitle=document.getElementById('mapSubtitle'),mapOpen=document.getElementById('mapOpen'),zoomButton=document.getElementById('zoomButton');
    const enc=encodeURIComponent,mins=value=>{const [h,m]=value.split(':').map(Number);return h*60+m},escapeHTML=value=>String(value||'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    document.documentElement.style.setProperty('--days',days.length);document.documentElement.style.setProperty('--start',startHour);document.documentElement.style.setProperty('--end',endHour);
    const axis=document.createElement('div');axis.className='time-axis';axis.style.gridColumn='1';axis.style.gridRow='2';for(let h=startHour;h<=endHour;h++){const label=document.createElement('span');label.className='time-label';label.style.top=`${(h-startHour)*hourHeight}px`;label.textContent=`${String(h).padStart(2,'0')}:00`;axis.appendChild(label)}calendar.appendChild(axis);
    days.forEach((day,index)=>{
      calendar.insertAdjacentHTML('beforeend',`<header class="day-head" data-day="${index}" style="grid-column:${index+2};grid-row:1"><span class="date"><small>${escapeHTML(day.m)}</small><strong>${escapeHTML(day.d)}</strong></span><div><h3>${escapeHTML(day.w)} · ${escapeHTML(day.title)}</h3><p>${escapeHTML(day.city)}</p></div><span class="route-icon">⌘</span></header>`);
      const body=document.createElement('div');body.className='day-body';body.style.gridColumn=String(index+2);body.style.gridRow='2';
      day.e.forEach(event=>{const [start,end,type,title,note,mapQuery,,mapPoints]=event,top=(mins(start)-startHour*60)/60*hourHeight,height=(mins(end)-mins(start))/60*hourHeight,compact=height<70?' compact':'';const button=(mapQuery||mapPoints?.[0])?`<button class="map-btn" data-map="${enc(mapQuery||mapPoints[0])}" data-title="${enc(title)}" aria-label="在地图显示">⌖</button>`:'';body.insertAdjacentHTML('beforeend',`<article class="event ${escapeHTML(type)}${compact}" style="top:${top}px;height:${Math.max(height-6,38)}px"><time>${escapeHTML(start)}—${escapeHTML(end)}</time><strong>${escapeHTML(title)}</strong>${note?`<small>${escapeHTML(note)}</small>`:''}${button}</article>`)});calendar.appendChild(body);
    });
    const zooms=[{label:'适中',z:13},{label:'大图',z:15}],state={type:'place',query:'Tokyo',points:[]};let zoomIndex=0;
    function loadMap(){const zoom=zooms[zoomIndex];zoomButton.textContent=zoom.label;if(state.type==='route'){const rest=state.points.slice(1).map(enc).join('+to:');mapFrame.src=`https://maps.google.com/maps?output=embed&saddr=${enc(state.points[0])}&daddr=${rest}&dirflg=d&z=${zoom.z}`;mapOpen.href=`https://www.google.com/maps/dir/?api=1&origin=${enc(state.points[0])}&destination=${enc(state.points.at(-1))}&waypoints=${state.points.slice(1,-1).map(enc).join('%7C')}`;}else{mapFrame.src=`https://maps.google.com/maps?output=embed&q=${enc(state.query)}&z=${zoom.z}`;mapOpen.href=`https://www.google.com/maps/search/?api=1&query=${enc(state.query)}`}}
    function dayPoints(day){const points=[day.hotel];day.e.forEach(event=>(event[7]?.length?event[7]:[event[5]]).forEach(point=>{if(point&&point!==points.at(-1))points.push(point)}));return points}
    document.querySelectorAll('.day-head').forEach(header=>header.addEventListener('click',()=>{const index=Number(header.dataset.day),day=days[index],points=dayPoints(day);state.type='route';state.points=points;zoomIndex=0;mapTitle.textContent=`${day.m} ${day.d} · ${day.title}`;mapSubtitle.textContent=`${points.length} 个点 · 按日程顺序串联`;document.querySelectorAll('.day-head').forEach((item,i)=>item.classList.toggle('active',i===index));loadMap()}));
    document.querySelectorAll('.map-btn').forEach(button=>button.addEventListener('click',event=>{event.stopPropagation();state.type='place';state.query=decodeURIComponent(button.dataset.map);zoomIndex=0;mapTitle.textContent=decodeURIComponent(button.dataset.title);mapSubtitle.textContent='单个行程点';document.querySelectorAll('.day-head').forEach(item=>item.classList.remove('active'));loadMap()}));
    zoomButton.addEventListener('click',()=>{zoomIndex=(zoomIndex+1)%zooms.length;loadMap()});
  </script>
</body>
</html>
